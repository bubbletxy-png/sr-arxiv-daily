# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Vincentqyw"
repo_name: "cv-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
keywords:
    "Image Generation":
        filters: ["Image Generation","Image Synthesis",
                  "Image-to-Image","Image Editing",
                  "Image Edit","Diffusion Transformer",
                  "Latent Diffusion","Rectified Flow"]

     "RAW and Linear-Domain Imaging":
        filters: ["RAW Image","RAW Images",
                  "RAW Generation","RAW Synthesis",
                  "RAW Diffusion","RAW-Diffusion",
                  "RAW-to-RGB","RGB-to-RAW",
                  "Sensor RAW","Bayer",
                  "Camera Sensor","Linear RGB",
                  "Linear Domain","Linear-Domain",
                  "Image Signal Processing","Neural ISP",
                  "Inverse ISP","Unprocessing"]

     "Image Super-Resolution and Restoration":
        filters: ["Super-Resolution","Super Resolution",
                  "Image Restoration","Image Reconstruction",
                  "Image Enhancement","Image Denoising",
                  "Image Deblurring","Blind Super-Resolution",
                  "Real-World Super-Resolution","Generative Super-Resolution",
                  "Diffusion Prior"]
